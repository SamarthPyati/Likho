# Hand-built code-mixed test set — docs/EVALUATION.md §1.2. TEST SET: never tune on it.
#
# expected_tokens is compact: space-separated `surface/code`, one per token as
# `likho.tokenize.split` produces them. Codes: h=hindi e=english ne=named_entity
# n=numeric p=punct d=devanagari. `eval.cases.load_cases` expands it to the
# {surface, kind} list of the spec.
#
# Labelling conventions:
# - English words stay `e` even when common in Hindi (bank, train, office): U5
#   keeps them Roman by default; U8 is the opt-in for Devanagari.
# - People, places, brands, festivals: `ne`.
# - Chat spellings of Hindi words (kr, nhi): `h`.
# - expected_native: hindi tokens in Devanagari, everything else unchanged.
#   Spelling follows common modern usage (हूं, आएगा, खत्म); nukta kept where
#   standard (ज़रूरत, रोज़). Variant spellings are F-taxonomy material, not errors
#   to argue about here.
#
# Annotation status: DRAFT. Labels written by one annotator (AI-assisted draft,
# 2026-10-30). The spec requires two team members to label independently and
# record disagreements below before results are reported.
annotation:
  annotator_a: "AI-assisted draft"
  annotator_b: null
  disagreements: null

