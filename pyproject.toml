[project]
name = "likho"
version = "0.1.0"
description = "Hinglish Smart Writing Assistant — Roman Hinglish to Devanagari, rewrite, translate"
requires-python = ">=3.10,<3.11"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["likho", "api", "app", "eval", "tests"]
python_files = ["*_test.py", "test_*.py"]
